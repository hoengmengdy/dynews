{% if pagination.pages > 1 %}<nav class="mt-5" aria-label="Pages"><ul class="pagination justify-content-center">{% if pagination.has_prev %}<li class="page-item"><a class="page-link" href="{{ request.path }}?page={{ pagination.prev_num }}{% if q is defined and q %}&amp;q={{ q|urlencode }}{% endif %}">Previous</a></li>{% endif %}<li class="page-item disabled"><span class="page-link">Page {{ pagination.page }} of {{ pagination.pages }}</span></li>{% if pagination.has_next %}<li class="page-item"><a class="page-link" href="{{ request.path }}?page={{ pagination.next_num }}{% if q is defined and q %}&amp;q={{ q|urlencode }}{% endif %}">Next</a></li>{% endif %}</ul></nav>{% endif %}
